<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EngageLab Tag Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>EngageLab Tag Tool</h1>
    <p>批量设置 Tag，或验证候选 registration ID 是否已绑定指定 Tag。</p>
  </header>

  <section class="card form-grid">
    <label>数据中心
      <select id="apiBase">
        <option value="https://pushapi-sgp.engagelab.com">新加坡</option>
        <option value="https://pushapi-usva.engagelab.com">美国</option>
        <option value="https://pushapi-defra.engagelab.com">德国</option>
        <option value="https://pushapi-hk.engagelab.com">中国香港</option>
        <option value="https://pushapi-jpn.engagelab.com">日本</option>
        <option value="https://pushapi-bra.engagelab.com">巴西</option>
      </select>
    </label>
    <label>Tag
      <input id="tag" maxlength="40" placeholder="例如 vip_user" autocomplete="off">
    </label>
    <label>AppKey
      <input id="appKey" placeholder="请输入 AppKey" autocomplete="off">
    </label>
    <label>Master Secret
      <input id="masterSecret" type="password" placeholder="请输入 Master Secret" autocomplete="new-password">
    </label>
  </section>

  <section class="card">
    <div class="toolbar">
      <label class="file-button">上传 CSV<input id="csvFile" type="file" accept=".csv,text/csv"></label>
      <a class="button secondary" href="registration-id-template.csv" download>下载 CSV 模板</a>
      <button id="clearIds" class="secondary" type="button">清空</button>
      <span id="idCount">0 个 registration ID</span>
    </div>
    <p class="hint">CSV 每行一个 ID；也可以手动输入，每输入一个 registration ID 后按 Enter 回车。</p>
    <textarea id="registrationIds" spellcheck="false" placeholder="registration-id-1&#10;registration-id-2"></textarea>
  </section>

  <section class="card toolbar">
    <button id="bindTag" type="button">批量设置 Tag</button>
    <button id="verifyTag" class="secondary" type="button">查询 Tag 绑定</button>
    <span id="status" aria-live="polite"></span>
  </section>

  <section id="result" class="card" hidden>
    <h2>处理结果</h2>
    <div id="summary" class="summary"></div>
    <button id="downloadBound" class="secondary" type="button" hidden>导出已绑定列表</button>
    <textarea id="boundList" class="result-list" readonly hidden></textarea>
    <pre id="details"></pre>
  </section>

  <p class="security-note">AppKey 和 Master Secret 仅保存在当前扩展页面内存中，不会写入浏览器存储。</p>
</main>
<script src="app.js"></script>
</body>
</html>
