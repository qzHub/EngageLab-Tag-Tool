name: Build standalone apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: EngageLab-Tag-Tool-macOS
          - os: windows-latest
            artifact: EngageLab-Tag-Tool-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean engagelab_tag_tool.spec

      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "dist/EngageLab Tag 工具.app" "dist/EngageLab-Tag-Tool-macOS.zip"

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\EngageLab-Tag-Tool.exe" -DestinationPath "dist\EngageLab-Tag-Tool-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
